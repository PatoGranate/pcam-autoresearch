# Small CNN on a 10% subset with 0% of the train labels flipped (Phase 2 noise study).
run_name: cnn_noise0
seed: 42

data:
  root: data
  subset_fraction: 0.1
  num_workers: 2

noise:
  flip_fraction: 0.0
  seed: 0

model:
  name: small_cnn

training:
  epochs: 10
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
